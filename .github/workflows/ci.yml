name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $app = Start-Process .\target\release\LocalVoice.exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "LocalVoice exited during startup (code $($app.ExitCode))" }
              $started = $app.MainWindowTitle -eq "LocalVoice"
            } until ($started -or (Get-Date) -ge $deadline)
            if (-not $started) { throw "LocalVoice window did not open" }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalVoice-windows-x64
          path: target/release/LocalVoice.exe
