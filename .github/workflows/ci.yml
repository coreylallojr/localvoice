name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      # Hosted runners have no GPU/OpenGL 2 for the window, so smoke-test the
      # packaged exe headlessly: settings, voices, device enumeration, DSP.
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $p = Start-Process ./target/release/LocalVoice.exe -ArgumentList "--self-check" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "LocalVoice --self-check failed ($($p.ExitCode))" }
          Get-Content "$env:APPDATA/LocalVoice/soak.log"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalVoice-windows-x64
          path: target/release/LocalVoice.exe
