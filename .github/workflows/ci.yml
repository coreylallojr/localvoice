name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -v

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name LocalVoice-windows-x64 --collect-all pedalboard --collect-all pystray --collect-all sounddevice localvoice/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: LocalVoice-windows-x64
          path: dist/LocalVoice-windows-x64.exe

