[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localvoice"
version = "0.2.1"
description = "A fully local, system-wide voice changer for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Corey" }]
dependencies = [
  "numpy>=2.0",
  "pedalboard>=0.9.26",
  "pillow>=11.0",
  "pynput>=1.8",
  "pystray>=0.19.5",
  "sounddevice>=0.5.2",
]

[project.scripts]
localvoice = "localvoice.app:main"

[tool.setuptools.packages.find]
include = ["localvoice*"]

