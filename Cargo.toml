[package]
name = "localvoice"
version = "0.3.0"
edition = "2024"
description = "A fully local, low-latency voice changer for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/coreylallojr/localvoice"
authors = ["Corey Lallo"]

[[bin]]
name = "LocalVoice"
path = "src/main.rs"

[dependencies]
biquad = "0.6.0"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "links"] }
nnnoiseless = "0.5.2"
realfft = "3.5.1"
rfd = "0.17.2"
ringbuf = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Console"] }
zip = "9.2.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep the DSP fast enough for real time even in debug builds/tests.
[profile.dev.package."*"]
opt-level = 2
